<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事数据分析</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f1923;
    color: #c5d0db;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
    padding: 24px 32px;
    border-bottom: 1px solid #1e3a5f;
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 {
    font-size: 22px; font-weight: 700; color: #e8f0fe;
    letter-spacing: 1px;
  }
  .header .badge {
    background: #1e6f50; color: #a8f0c8; padding: 4px 12px;
    border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .tabs {
    display: flex; background: #152232; border-bottom: 2px solid #1e3a5f;
    padding: 0 24px;
  }
  .tab {
    padding: 14px 28px; cursor: pointer; font-size: 14px; font-weight: 600;
    color: #7a8fa3; border-bottom: 3px solid transparent;
    transition: all .2s; user-select: none;
  }
  .tab:hover { color: #a0c4e8; background: rgba(30,100,180,.08); }
  .tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; background: rgba(79,195,247,.06); }
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px; background: #121f2d;
    border-bottom: 1px solid #1a2d40;
  }
  .toolbar input {
    background: #1a2d40; border: 1px solid #2a4560; color: #c5d0db;
    padding: 8px 14px; border-radius: 6px; font-size: 13px; width: 280px;
    outline: none; transition: border-color .2s;
  }
  .toolbar input:focus { border-color: #4fc3f7; }
  .toolbar input::placeholder { color: #556b80; }
  .toolbar .count { color: #556b80; font-size: 13px; margin-left: auto; }
  .table-wrap {
    overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 180px);
    margin: 0;
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    white-space: nowrap;
  }
  thead { position: sticky; top: 0; z-index: 10; }
  thead th {
    background: #162636; color: #8fa8c2; padding: 10px 12px;
    text-align: center; font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 2px solid #1e3a5f; cursor: pointer;
    user-select: none; position: relative;
  }
  thead th:hover { color: #b0d0f0; background: #1a3048; }
  thead th .sort-icon { margin-left: 4px; font-size: 10px; opacity: .4; }
  thead th.sorted .sort-icon { opacity: 1; color: #4fc3f7; }
  /* Section headers in main table */
  thead th.section-header {
    background: #1a3048; color: #6ab0e0; font-size: 11px;
    letter-spacing: 1.5px; border-bottom: 1px solid #2a4a68;
    padding: 6px 8px;
  }
  tbody tr { border-bottom: 1px solid #152535; transition: background .15s; }
  tbody tr:hover { background: rgba(79,195,247,.06); }
  tbody td {
    padding: 9px 12px; text-align: center;
    border-right: 1px solid #152535;
  }
  tbody td:first-child { text-align: left; padding-left: 16px; font-weight: 600; color: #a0c4e8; }
  /* Result badges */
  .badge-win { background: #1b5e20; color: #a5d6a7; padding: 2px 10px; border-radius: 10px; font-weight: 600; font-size: 12px; }
  .badge-draw { background: #4a3800; color: #ffd54f; padding: 2px 10px; border-radius: 10px; font-weight: 600; font-size: 12px; }
  .badge-lose { background: #7f1d1d; color: #ef9a9a; padding: 2px 10px; border-radius: 10px; font-weight: 600; font-size: 12px; }
  /* Odds coloring */
  .odds-low { color: #66bb6a; }
  .odds-mid { color: #ffa726; }
  .odds-high { color: #ef5350; }
  /* Handicap */
  .handicap-neg { color: #ef9a9a; }
  .handicap-pos { color: #a5d6a7; }
  /* Score highlight */
  .score { font-weight: 700; color: #fff; background: #1a3048; padding: 3px 10px; border-radius: 6px; display: inline-block; }
  /* Goals bar */
  .goal-bar { display: inline-block; height: 16px; background: #4fc3f7; border-radius: 3px; vertical-align: middle; min-width: 4px; }
  /* Panel */
  .panel { display: none; }
  .panel.active { display: block; }
  /* Responsive */
  @media (max-width: 768px) {
    .header h1 { font-size: 16px; }
    .tab { padding: 10px 16px; font-size: 13px; }
    .toolbar input { width: 200px; }
  }
</style>
</head>

// Result badge helper
function resultBadge(val) {
  if (!val) return '';
  const s = String(val);
  if (s === '胜') return '<span class="badge-win">胜</span>';
  if (s === '平') return '<span class="badge-draw">平</span>';
  if (s === '负') return '<span class="badge-lose">负</span>';
  return s;
}

// Odds color
function oddsColor(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  if (n < 2) return '<span class="odds-low">' + val + '</span>';
  if (n < 4) return '<span class="odds-mid">' + val + '</span>';
  return '<span class="odds-high">' + val + '</span>';
}

// Handicap
function handicap(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  if (n < 0) return '<span class="handicap-neg">' + val + '</span>';
  if (n > 0) return '<span class="handicap-pos">+' + val + '</span>';
  return val;
}

// Build main table
function buildMainTable(data) {
  const sectionHeaders = `<tr>
    <th colspan="4" class="section-header">基本信息</th>
    <th colspan="3" class="section-header">不让球</th>
    <th colspan="4" class="section-header">让球</th>
    <th colspan="9" class="section-header">半全场</th>
    <th colspan="9" class="section-header">进球数</th>
    <th colspan="5" class="section-header">结果</th>
  </tr>`;
  const cols = ['比赛编号','联赛','时间','对阵双方','胜','平','负','受/让','胜','平','负','胜胜','胜平','胜负','平胜','平平','平负','负胜','负平','负负','0','1','2','3','4','5','6','7+','比分','不让球','让球','半全场','进球数'];
  let th = '<tr>' + cols.map((c,i) => `<th data-col="${i}">${c}<span class="sort-icon">⇅</span></th>`).join('') + '</tr>';
  let tbody = '';
  data.forEach(row => {
    tbody += '<tr>';
    row.forEach((v, i) => {
      let cls = '';
      let display = v != null ? v : '';
      // Col 28 = 比分
      if (i === 28) { display = '<span class="score">' + display + '</span>'; }
      // Col 29 = 不让球, 30 = 让球, 31 = 半全场, 32 = 进球数 → result badge
      if (i >= 29 && i <= 32) { display = resultBadge(v); }
      // Col 7 = 受/让 (handicap)
      if (i === 7) { display = handicap(v); }
      // Odds cols: 4-6, 8-10, 11-19
      if ((i >= 4 && i <= 6) || (i >= 8 && i <= 10) || (i >= 11 && i <= 19)) {
        display = oddsColor(v);
      }
      tbody += `<td>${display}</td>`;
    });
    tbody += '</tr>';
  });
  return `<table><thead>${sectionHeaders}${th}</thead><tbody>${tbody}</tbody></table>`;
}

// Build simple table (halftime / goals)
function buildSimpleTable(headers, data) {
  let th = '<tr>' + headers.map((c,i) => `<th data-col="${i}">${c}<span class="sort-icon">⇅</span></th>`).join('') + '</tr>';
  let tbody = '';
  data.forEach(row => {
    tbody += '<tr>';
    row.forEach((v, i) => {
      let display = v != null ? v : '';
      // Last 4 cols are results
      if (i >= headers.length - 4) {
        const h = headers[i];
        if (h === '不让球' || h === '让球' || h === '半全场') display = resultBadge(v);
        else if (h === '进球数') display = '<span class="score">' + display + '</span>';
        else if (h === '比分') display = '<span class="score">' + display + '</span>';
      }
      // Odds coloring for numeric cells (skip first col and result cols)
      if (i > 0 && i < headers.length - 4) {
        display = oddsColor(v);
      }
      tbody += `<td>${display}</td>`;
    });
    tbody += '</tr>';
  });
  return `<table><thead>${th}</thead><tbody>${tbody}</tbody></table>`;
}

// Render panels
document.getElementById('mainPanel').innerHTML = buildMainTable(DATA.main.data);
document.getElementById('halftimePanel').innerHTML = buildSimpleTable(DATA.halftime.headers, DATA.halftime.data);
document.getElementById('goalsPanel').innerHTML = buildSimpleTable(DATA.goals.headers, DATA.goals.data);

// Update count
function updateCount() {
  const active = document.querySelector('.panel.active');
  const rows = active.querySelectorAll('tbody tr:not([style*="display: none"])');
  document.getElementById('rowCount').textContent = rows.length + ' 条记录';
}
updateCount();

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.panel + 'Panel').classList.add('active');
    updateCount();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.panel.active tbody tr').forEach(tr => {
    const text = tr.textContent.toLowerCase();
    tr.style.display = text.includes(q) ? '' : 'none';
  });
  updateCount();
});

// Sort
document.querySelectorAll('thead').forEach(thead => {
  thead.addEventListener('click', function(e) {
    const th = e.target.closest('th');
    if (!th || th.classList.contains('section-header')) return;
    const col = parseInt(th.dataset.col);
    if (isNaN(col)) return;
    const table = th.closest('table');
    const tbody = table.querySelector('tbody');
    const rows = Array.from(tbody.rows);
    const asc = !th.classList.contains('sorted-asc');
    // Clear all sort indicators
    table.querySelectorAll('th').forEach(h => {
      h.classList.remove('sorted', 'sorted-asc', 'sorted-desc');
    });
    th.classList.add('sorted', asc ? 'sorted-asc' : 'sorted-desc');
    rows.sort((a, b) => {
      let va = a.cells[col]?.textContent.trim() || '';
      let vb = b.cells[col]?.textContent.trim() || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return asc ? na - nb : nb - na;
      return asc ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
    });
    rows.forEach(r => tbody.appendChild(r));
  });
});
</script>
